<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ojoanalogo — concept previews</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e6e6e6;
        --bg: #fafafa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.45;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      a {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 4px;
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        background: #fff;
      }
      .name {
        font-weight: 500;
      }
      .port {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.9rem;
      }
      .hint {
        margin-top: 28px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ojoanalogo concepts</h1>
      <p>Local previews — click to open. Leave the hub script running.</p>
      <ol id="list"></ol>
      <p class="hint">
        Hub: <code>http://127.0.0.1:3333</code> · stop with Ctrl+C in the terminal
      </p>
    </main>
    <script>
      const concepts = [
        ['Infinite Folio (elegido)', 5112],
        ['Detent (reserva)', 5111],
      ];
      const list = document.getElementById('list');
      for (const [name, port] of concepts) {
        const li = document.createElement('li');
        li.innerHTML = `<a href="http://127.0.0.1:${port}/" target="_blank" rel="noreferrer"><span class="name">${name}</span><span class="port">:${port}</span></a>`;
        list.appendChild(li);
      }
    </script>
  </body>
</html>
